# Drop-in for sunshine.service — labwc headless stream mode.
#
# Install to: ~/.config/systemd/user/sunshine.service.d/labwc-stream.conf
#
# Makes Sunshine connect to the labwc compositor via the stable symlink
# (wayland-stream) instead of the KDE Plasma session (wayland-0).
# Sunshine's wlr-screencopy capture then reads from the labwc HEADLESS-1
# output, leaving the physical KDE desktop completely untouched.
[Unit]
After=sunshine-labwc.service
Requires=sunshine-labwc.service

[Service]
Environment=WAYLAND_DISPLAY=wayland-stream
