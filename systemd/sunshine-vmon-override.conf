# Drop-in for sunshine.service — vmon crash recovery.
#
# Install to: ~/.config/systemd/user/sunshine.service.d/vmon-recovery.conf
#
# Runs sunshine-stop-vmon.sh after Sunshine stops for any reason (including
# crashes). This restores the physical monitor layout even if the undo-cmd
# never ran. Safe to call when no stream was active — apply_idle_layout is
# idempotent.
[Service]
ExecStopPost=/home/USER/projects/sunshine-kde-vmon/vmon/sunshine-stop-vmon.sh
